<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI開発・コンサルタント | ポートフォリオ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family: "Segoe UI", sans-serif;
    background:#0f172a;
    color:white;
    line-height:1.8;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#2563eb55 0%,transparent 40%),
    radial-gradient(circle at bottom right,#06b6d455 0%,transparent 40%);
    z-index:-1;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

section{
    padding:100px 0;
}

.glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero-content h1{
    font-size:4rem;
    line-height:1.1;
    margin-bottom:20px;
}

.gradient{
    background:linear-gradient(
    90deg,
    #60a5fa,
    #22d3ee
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:#cbd5e1;
    font-size:1.2rem;
    margin-bottom:40px;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
    margin:5px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    transform:translateY(-3px);
    background:#1d4ed8;
}

.btn-secondary{
    background:#1e293b;
    color:white;
}

.btn-secondary:hover{
    transform:translateY(-3px);
}

.section-title{
    text-align:center;
    font-size:2.5rem;
    margin-bottom:60px;
}

.about{
    padding:40px;
}

.about p{
    color:#cbd5e1;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
}

.skill{
    padding:12px 20px;
    border-radius:999px;
    background:#1e293b;
    transition:.3s;
}

.skill:hover{
    background:#2563eb;
    transform:translateY(-3px);
}

.
